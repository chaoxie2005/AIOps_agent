[project]
name = "aiops-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chaoxie", email = "3320841884@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-mongodb>=0.5.1",
    "logger>=1.4",
    "minio>=7.2.20",
    "pymilvus>=3.0.2",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
aiops-agent = "aiops_agent:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
